name: Test

# Only run for pull requests as we care contribution to the main
# - There are changes in RTL files
on:
  pull_request:
  push:
    branches:
      - 'main'

jobs:
  quick_test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Quick test (Windows)"
            os: windows-latest
          - name: "Quick test (Mac OS)"
            os: macos-latest
          - name: "Quick test (Ubuntu)"
            os: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo python3 -m pip install -r requirements.txt

      - name: Running test
        shell: bash
        run: |
          make quick_test

  reg_test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Reg test (Windows)"
            os: windows-latest
          - name: "Reg test (Mac OS)"
            os: macos-latest
          - name: "Reg test (Ubuntu)"
            os: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install OSS CAD Suite (includes Yosys)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} # Optional: prevents public API rate limits
          
      - name: Verify Yosys Installation
        run: yosys --version

      - name: Install dependencies
        run: |
          sudo python3 -m pip install -r requirements.txt

      - name: Running test without Qor checks
        shell: bash
        run: |
          make reg_test

      - name: Running test with Qor checks
        shell: bash
        run: |
          make reg_test CHECK_QOR=ON

      - name: Runtime file tree
        if: failure()
        run:
          tree tests/task

      - name: Upload runtime workspace for debgging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reg_test_artifacts
          # Captures every file inside any folder starting with '_work'
          path: tests/tasks/**/_work*/** 

  create_golden:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Reg golden (Windows)"
            os: windows-latest
          - name: "Reg golden (Mac OS)"
            os: macos-latest
          - name: "Reg golden (Ubuntu)"
            os: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install OSS CAD Suite (includes Yosys)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} # Optional: prevents public API rate limits
          
      - name: Verify Yosys Installation
        run: yosys --version

      - name: Install dependencies
        run: |
          sudo python3 -m pip install -r requirements.txt

      - name: Running test
        shell: bash
        run: |
          make reg_golden

      - name: Running test to parse report only
        shell: bash
        run: |
          make reg_golden PARSE_REPORT_ONLY=ON

      - name: Runtime file tree
        if: failure()
        run:
          tree tests/tasks

      - name: Upload runtime workspace for debgging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reg_golden_artifacts
          # Captures every file inside any folder starting with '_work'
          path: tests/tasks/**/_work*/** 
