name: Test

# Only run for pull requests as we care contribution to the main
# - There are changes in RTL files
on:
  pull_request:
  push:
    branches:
      - 'main'

jobs:
  quick_test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Quick test (Windows)"
            os: windows-latest
          - name: "Quick test (Mac OS)"
            os: macos-latest
          - name: "Quick test (Ubuntu)"
            os: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Setup clean system Python across all OSes
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Or '3.11', '3.13', etc.

      # Create venv and install requirements
      - name: Create venv and install dependencies
        shell: bash
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=${PWD}/.venv" >> "$GITHUB_ENV"
          if [ -d ".venv/Scripts" ]; then
            echo "${PWD}/.venv/Scripts" >> "$GITHUB_PATH"
            .venv/Scripts/python.exe -m pip install --upgrade pip
            .venv/Scripts/pip.exe install -r requirements.txt
          else
            echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
          fi

      - name: Running test
        shell: bash
        run: |
          make quick_test

  reg_test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Reg test (Windows)"
            os: windows-latest
          - name: "Reg test (Mac OS)"
            os: macos-latest
          - name: "Reg test (Ubuntu)"
            os: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1. Cache the downloaded .tgz archive on Windows
      - name: Cache OSS CAD Suite archive (Windows)
        id: cache-oss-cad
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oss-cad-suite.tgz
          key: oss-cad-suite-windows-x64-2026-11-12

      # 2. Download only on cache miss, then extract and update PATH
      - name: Setup OSS CAD Suite (Windows Workaround)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="2026-11-12"
          DATE_TAG="${VERSION//-/}"
          BASE_URL="https://github.com"
          FILE_NAME="oss-cad-suite-windows-x64-${DATE_TAG}.tgz"
          URL="${BASE_URL}/${VERSION}/${FILE_NAME}"
          ARCHIVE="${RUNNER_TEMP}/oss-cad-suite.tgz"

          # Download only if the archive was not restored from cache
          if [ "${{ steps.cache-oss-cad.outputs.cache-hit }}" != "true" ]; then
            echo "Cache miss. Downloading OSS CAD Suite..."
            curl -fsSL "$URL" -o "$ARCHIVE"
          else
            echo "Cache hit. Skipping download."
          fi

          # Extract the archive into the runner temp directory
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP"

          # Expose EDA tools (Yosys, Verilator, etc.) to subsequent workflow steps
          echo "${RUNNER_TEMP}/oss-cad-suite/bin" >> "$GITHUB_PATH"
          echo "${RUNNER_TEMP}/oss-cad-suite/lib" >> "$GITHUB_PATH"

      - name: Install OSS CAD Suite (includes Yosys)
        if: runner.os != 'Windows'
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} # Optional: prevents public API rate limits
          version: "2026-11-12"
          python-override: false # Keep false (default) so it doesn't hijack Python
          
      - name: Verify Yosys Installation
        run: yosys --version

      # Setup clean system Python across all OSes
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Or '3.11', '3.13', etc.

      # Create venv and install requirements
      - name: Create venv and install dependencies
        shell: bash
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=${PWD}/.venv" >> "$GITHUB_ENV"
          if [ -d ".venv/Scripts" ]; then
            echo "${PWD}/.venv/Scripts" >> "$GITHUB_PATH"
            .venv/Scripts/python.exe -m pip install --upgrade pip
            .venv/Scripts/pip.exe install -r requirements.txt
          else
            echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
          fi

      - name: Running test without Qor checks
        shell: bash
        run: |
          make reg_test

      - name: Running test with Qor checks
        shell: bash
        run: |
          make reg_test CHECK_QOR=ON

      - name: Runtime file tree
        if: failure()
        run:
          tree tests/task

      - name: Upload runtime workspace for debgging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reg_test_artifacts
          # Captures every file inside any folder starting with '_work'
          path: tests/tasks/**/_work*/** 

  create_golden:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Reg golden (Windows)"
            os: windows-latest
          - name: "Reg golden (Mac OS)"
            os: macos-latest
          - name: "Reg golden (Ubuntu)"
            os: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1. Cache the downloaded .tgz archive on Windows
      - name: Cache OSS CAD Suite archive (Windows)
        id: cache-oss-cad
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oss-cad-suite.tgz
          key: oss-cad-suite-windows-x64-2026-11-12

      # 2. Download only on cache miss, then extract and update PATH
      - name: Setup OSS CAD Suite (Windows Workaround)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="2026-11-12"
          DATE_TAG="${VERSION//-/}"
          BASE_URL="https://github.com"
          FILE_NAME="oss-cad-suite-windows-x64-${DATE_TAG}.tgz"
          URL="${BASE_URL}/${VERSION}/${FILE_NAME}"
          ARCHIVE="${RUNNER_TEMP}/oss-cad-suite.tgz"

          # Download only if the archive was not restored from cache
          if [ "${{ steps.cache-oss-cad.outputs.cache-hit }}" != "true" ]; then
            echo "Cache miss. Downloading OSS CAD Suite..."
            curl -fsSL "$URL" -o "$ARCHIVE"
          else
            echo "Cache hit. Skipping download."
          fi

          # Extract the archive into the runner temp directory
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP"

          # Expose EDA tools (Yosys, Verilator, etc.) to subsequent workflow steps
          echo "${RUNNER_TEMP}/oss-cad-suite/bin" >> "$GITHUB_PATH"
          echo "${RUNNER_TEMP}/oss-cad-suite/lib" >> "$GITHUB_PATH"

      - name: Install OSS CAD Suite (includes Yosys)
        if: runner.os != 'Windows'
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} # Optional: prevents public API rate limits
          version: "2026-11-12"
          python-override: false # Keep false (default) so it doesn't hijack Python
          
      - name: Verify Yosys Installation
        run: yosys --version

      # Setup clean system Python across all OSes
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Or '3.11', '3.13', etc.

      # Create venv and install requirements
      - name: Create venv and install dependencies
        shell: bash
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=${PWD}/.venv" >> "$GITHUB_ENV"
          if [ -d ".venv/Scripts" ]; then
            echo "${PWD}/.venv/Scripts" >> "$GITHUB_PATH"
            .venv/Scripts/python.exe -m pip install --upgrade pip
            .venv/Scripts/pip.exe install -r requirements.txt
          else
            echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
          fi

      - name: Running test
        shell: bash
        run: |
          make reg_golden

      - name: Running test to parse report only
        shell: bash
        run: |
          make reg_golden PARSE_REPORT_ONLY=ON

      - name: Runtime file tree
        if: failure()
        run:
          tree tests/tasks

      - name: Upload runtime workspace for debgging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reg_golden_artifacts
          # Captures every file inside any folder starting with '_work'
          path: tests/tasks/**/_work*/** 
