name: Test

# Only run for pull requests as we care contribution to the main
# - There are changes in RTL files
on:
  pull_request:
  push:
    branches:
      - 'main'

jobs:
  quick_test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Quick test (Windows)"
            os: windows-latest
          - name: "Quick test (Mac OS)"
            os: macos-latest
          - name: "Quick test (Ubuntu)"
            os: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Setup clean system Python across all OSes
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Or '3.11', '3.13', etc.

      # Create venv and install requirements
      - name: Create venv and install dependencies
        shell: bash
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=${PWD}/.venv" >> "$GITHUB_ENV"
          if [ -d ".venv/Scripts" ]; then
            echo "${PWD}/.venv/Scripts" >> "$GITHUB_PATH"
            .venv/Scripts/python.exe -m pip install --upgrade pip
            .venv/Scripts/pip.exe install -r requirements.txt
          else
            echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
          fi

      - name: Running test
        shell: bash
        run: |
          make quick_test

  reg_test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Reg test (Windows)"
            os: windows-latest
          - name: "Reg test (Mac OS)"
            os: macos-latest
          - name: "Reg test (Ubuntu)"
            os: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup OSS CAD Suite (Manual Windows .tgz)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "2026-11-12"
          $dateTag = $version -replace "-", ""
          $url = "https://github.com"
          $archive = "$env:RUNNER_TEMP\oss-cad-suite.tgz"
          $dest = "$env:RUNNER_TEMP"
      
          Invoke-WebRequest -Uri $url -OutFile $archive
          tar -xzf $archive -C $dest
      
          # Add binary and library paths to GitHub Actions PATH
          "$dest\oss-cad-suite\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$dest\oss-cad-suite\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install OSS CAD Suite (includes Yosys)
        if: runner.os != 'Windows'
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} # Optional: prevents public API rate limits
          version: "2026-11-12"
          python-override: false # Keep false (default) so it doesn't hijack Python
          
      - name: Verify Yosys Installation
        run: yosys --version

      # Setup clean system Python across all OSes
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Or '3.11', '3.13', etc.

      # Create venv and install requirements
      - name: Create venv and install dependencies
        shell: bash
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=${PWD}/.venv" >> "$GITHUB_ENV"
          if [ -d ".venv/Scripts" ]; then
            echo "${PWD}/.venv/Scripts" >> "$GITHUB_PATH"
            .venv/Scripts/python.exe -m pip install --upgrade pip
            .venv/Scripts/pip.exe install -r requirements.txt
          else
            echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
          fi

      - name: Running test without Qor checks
        shell: bash
        run: |
          make reg_test

      - name: Running test with Qor checks
        shell: bash
        run: |
          make reg_test CHECK_QOR=ON

      - name: Runtime file tree
        if: failure()
        run:
          tree tests/task

      - name: Upload runtime workspace for debgging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reg_test_artifacts
          # Captures every file inside any folder starting with '_work'
          path: tests/tasks/**/_work*/** 

  create_golden:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Reg golden (Windows)"
            os: windows-latest
          - name: "Reg golden (Mac OS)"
            os: macos-latest
          - name: "Reg golden (Ubuntu)"
            os: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup OSS CAD Suite (Manual Windows .tgz)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "2026-11-12"
          $dateTag = $version -replace "-", ""
          $url = "https://github.com"
          $archive = "$env:RUNNER_TEMP\oss-cad-suite.tgz"
          $dest = "$env:RUNNER_TEMP"
      
          Invoke-WebRequest -Uri $url -OutFile $archive
          tar -xzf $archive -C $dest
      
          # Add binary and library paths to GitHub Actions PATH
          "$dest\oss-cad-suite\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$dest\oss-cad-suite\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install OSS CAD Suite (includes Yosys)
        if: runner.os != 'Windows'
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} # Optional: prevents public API rate limits
          version: "2026-11-12"
          python-override: false # Keep false (default) so it doesn't hijack Python
          
      - name: Verify Yosys Installation
        run: yosys --version

      # Setup clean system Python across all OSes
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Or '3.11', '3.13', etc.

      # Create venv and install requirements
      - name: Create venv and install dependencies
        shell: bash
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=${PWD}/.venv" >> "$GITHUB_ENV"
          if [ -d ".venv/Scripts" ]; then
            echo "${PWD}/.venv/Scripts" >> "$GITHUB_PATH"
            .venv/Scripts/python.exe -m pip install --upgrade pip
            .venv/Scripts/pip.exe install -r requirements.txt
          else
            echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
          fi

      - name: Running test
        shell: bash
        run: |
          make reg_golden

      - name: Running test to parse report only
        shell: bash
        run: |
          make reg_golden PARSE_REPORT_ONLY=ON

      - name: Runtime file tree
        if: failure()
        run:
          tree tests/tasks

      - name: Upload runtime workspace for debgging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reg_golden_artifacts
          # Captures every file inside any folder starting with '_work'
          path: tests/tasks/**/_work*/** 
