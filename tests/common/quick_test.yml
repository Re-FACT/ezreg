    workspace: "[TASK_ROOT]/ys_quick_test/_work"
    subtasks: "[TASK_ROOT]/ys_quick_test/config/task.yaml" 
    # If there are golden results, pass checks can be performed
    golden_result: "[TASK_ROOT]/ys_quick_test/config/golden.csv"
  - name: ys_quick_test_no_qor_check
    workspace: "[TASK_ROOT]/ys_quick_test_no_qor_check/_work"
    subtasks: "[TASK_ROOT]/ys_quick_test_no_qor_check/config/task.yaml" 
  - name: subtask_disable
    workspace: "[TASK_ROOT]/subtask_disable/_work"
    subtasks: "[TASK_ROOT]/subtask_disable/config/task.yaml" 
